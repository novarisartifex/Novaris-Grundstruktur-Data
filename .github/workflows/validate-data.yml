name: Validate Novaris data
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'data/**'
      - 'media/**'
      - 'tools/validate_manifest.py'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and all published assets
        run: python3 tools/validate_manifest.py
